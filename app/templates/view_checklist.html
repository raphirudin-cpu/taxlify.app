<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Checklist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group p {
            margin: 0;
            padding: 10px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .navbar a {
            margin-right: 15px;
        }

    </style>
</head>
<body>
    <div class="navbar">
        <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('settings.settings') }}">Settings</a>
        <a href="{{ url_for('advisor.advisors') }}">Advisors</a>
        <a href="{{ url_for('statistics.statistics') }}">Statistics</a>
        <a href="{{ url_for('tips_news.tips_news') }}">Tips and News</a>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>
    <div class="content">
        <h2>Checklist für Steuerjahr {{ tax_year.year }}</h2>
        {% for step, question in questions.items() %}
            {% if step in checklist %}
                <div class="form-group">
                    <label>{{ question["question"] }}</label>
                    <p>{{ checklist[step] }}</p>
                </div>
            {% endif %}
        {% endfor %}
    </div>
    <div class="form-group">
        <a href="{{ url_for('dashboard.dashboard') }}" class="button-blue">Back to Dashboard</a>
        <a href="{{ url_for('generate_pdf.generate_pdf', user_id=tax_year.user_id, tax_year_id=tax_year.id) }}" class="button-blue">
            Download Checklist
        </a>
    </div>
</body>
</html>
