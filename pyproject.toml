[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["migrations", "venv", ".venv", "__pycache__"]

[tool.ruff.lint]
# Intentionally lean for this legacy codebase: catch genuine bugs
# (syntax errors, undefined names, broken f-strings, duplicate args) rather
# than style. This is the class of error a refactor can introduce. Tighten
# over time by adding e.g. "F401" (unused imports) once the backlog is cleared.
select = ["E9", "F63", "F7", "F82"]
